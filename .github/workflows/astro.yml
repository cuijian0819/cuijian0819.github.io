name: astro

# Deliberately NOT triggered on push to master yet.
#
# The Jekyll workflow in deploy.yml still owns deployment, and the repository's
# Pages source is still the gh-pages branch. Cutting over means, in order:
#   1. delete the four Jekyll workflows
#   2. add the `deploy` job below
#   3. change this trigger to `push: { branches: [master] }`
#   4. switch Pages source to "GitHub Actions" in repository settings
# Doing 1-3 without 4 leaves the old site serving; doing 4 without 1-3 breaks it.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

